diseñada para asegurar inversión.\",\"Prepare a training module on cybersecurity best practices\":\"Prepara un módulo de capacitación sobre mejores prácticas de ciberseguridad\",\"Prepare a training module on cybersecurity best practices for employees, covering topics such as password security, phishing awareness, and data protection. The module should be interactive and easy to understand, designed to improve employee awareness and reduce security risks.\":\"Prepara un módulo de capacitación sobre mejores prácticas de ciberseguridad para empleados, cubriendo temas como seguridad de contraseñas, conciencia sobre phishing y protección de datos. El módulo debe ser interactivo y fácil de entender, diseñado para mejorar la conciencia de los empleados y reducir riesgos de seguridad.\",\"Create a sales presentation for a B2B software solution\":\"Crea una presentación de ventas para una solución de software B2B\",\"Create a sales presentation for a B2B software solution, showcasing its features, benefits, and ROI for potential clients. The presentation should be tailored to the specific needs of the target audience, designed to close deals.\":\"Crea una presentación de ventas para una solución de software B2B, mostrando sus características, beneficios y retorno de inversión (ROI) para clientes potenciales. La presentación debe estar adaptada a las necesidades específicas del público objetivo y diseñada para cerrar acuerdos.\",\"Sample prompts\":\"Ejemplos de prompts\",\"Choose a style\":\"Elige un estilo\",\"Restore and color image with cinematic Leica style\":\"Restaura y colorea una imagen con estilo cinematográfico Leica\",\"Restore and color the image so that everything has color (in a coherent manner) but feels cinematic. Lots of color. It should look like a photograph taken in the present (high quality) shot on Leica.\":\"Restaura y colorea la imagen de manera que todo tenga color (de forma coherente) pero con un estilo cinematográfico. Colores vibrantes. Debería parecer una fotografía actual (de alta calidad) tomada con una Leica.\",\"Generate 4 realistic POV variations from reference image\":\"Genera 4 variaciones realistas de puntos de vista a partir de una imagen de referencia\",\"Change the angle of the shot for each given reference image, creating four variations from different perspectives while keeping the environment consistent so they appear as realistic views from different POVs. The final images must exclude the original viewpoint, and suggested alternatives include ceiling view, side view, rear view, front view, diagonal side view, and near-floor view.\":\"Cambia el ángulo de la toma para cada imagen de referencia proporcionada, creando cuatro variaciones desde diferentes perspectivas mientras mantienes el entorno consistente, para que parezcan vistas realistas desde distintos puntos de vista. Las imágenes finales deben excluir el punto de vista original, y se sugieren alternativas como vista desde el techo, vista lateral, vista trasera, vista frontal, vista lateral en diagonal y vista cerca del suelo.\",\"Create Gundam-style mecha figure with model kit packaging\":\"Crea una figura de mecha estilo Gundam con empaque de modelo para armar\",\"Transform the character in the photo into the style of a Gundam model kit packaging box, presented in an isometric perspective. Inside the box, showcase a Gundam-style mecha version of the character from the photo, accompanied by their essential items (such as cosmetics, bags, or others) redesigned as futuristic mecha accessories. The packaging should resemble authentic Gunpla boxes, with technical illustrations, instruction-manual style details, and sci-fi typography. Next to the box, also display the actual Gundam-style mecha figure itself outside of the packaging, rendered in a realistic and lifelike style, similar to official Bandai promotional renders.\\nProfessional model kit packaging box in isometric perspective, featuring a futuristic mecha design. The box design mimics authentic model packaging with technical illustrations, blueprint-style diagrams, and sci-fi typography. The packaging includes a transparent window showcasing a detailed mecha figure with elegant armor plating, intricate panel lines, metallic finishes, and LED-like glowing elements. Accessories are reimagined as advanced weaponry and armor details. The composition includes professional lighting against a clean background, highlighting both the packaging design and the detailed mecha figure. The overall look combines the elegance of the original concept with futuristic, high-tech elements, capturing a polished, promotional photography style.\":\"$f\",\"Make 4-panel montage photo using b-roll footage\":\"Crear una foto montaje de 4 paneles usando material de B-roll\",\"Create a 4-panel montage photo of b-roll footage based on the reference image.\":\"Crea una foto de montaje de 4 paneles a partir de material de B-roll basado en la imagen de referencia.\",\"Create realistic product variations with logo intact\":\"Crear variaciones realistas del producto manteniendo el logo intacto\",\"Take this product photo and create realistic variations while keeping the shape, size, logo, and proportions unchanged. Generate the product in while maintaining natural lighting, reflections, and shadows. Do not distort the label or branding.\":\"Toma esta foto del producto y crea variaciones realistas manteniendo la forma, tamaño, logotipo y proporciones sin cambios. Genera el producto manteniendo la iluminación natural, reflejos y sombras. No distorsiones la etiqueta ni el branding.\",\"Place product naturally in a realistic hand\":\"Colocar el producto naturalmente en una mano realista\",\"Place the product inside a realistic hand as if someone is holding it naturally. Keep proportions correct and preserve product details.\":\"Coloca el producto en una mano realista como si alguien lo estuviera sosteniendo de forma natural. Mantén las proporciones correctas y preserva los detalles del producto.\",\"Studio perfume bottle shot on frosted glass with premium lighting\":\"Fotografía de estudio de botella de perfume sobre vidrio esmerilado con iluminación premium\",\"Studio shot of a perfume bottle, elegantly positioned on a frosted glass background, soft ambient shadows, smooth gradient backdrop, high-key lighting, shallow depth of field, ultra-sharp focus on the subject, subtle reflections, minimal aesthetic, professional DSLR, premium commercial lighting setup, optimized for high-end product presentation.\":\"Fotografía de estudio de una botella de perfume, elegantemente posicionada sobre un fondo de vidrio esmerilado, con sombras ambientales suaves, fondo de gradiente suave, iluminación de alta intensidad, poca profundidad de campo, enfoque ultra preciso en el sujeto, sutiles reflejos, estética minimalista. Realizado con una DSLR profesional y un montaje de iluminación comercial premium, optimizado para la presentación de productos de alta gama.\",\"Modify hairstyles with different cuts \u0026 colors\":\"Modificar peinados con diferentes cortes y colores\",\"Modify hairstyles in the portrait photos with different cuts, colors, and styles while maintaining facial features.\":\"Modificar peinados en fotos de retrato con diferentes cortes, colores y estilos mientras se mantienen los rasgos faciales.\",\"Make professional passport portrait photo\":\"Realizar una foto de retrato profesional para pasaporte\",\"make me a professional passport portrait photo with this image.\":\"Hazme una foto de retrato profesional para pasaporte con esta imagen.\",\"Remove unwanted people/objects in the background\":\"Eliminar personas u objetos no deseados en el fondo\",\"Remove unwanted people or objects from the background while preserving the main subject and natural scene.\":\"Eliminar personas u objetos no deseados del fondo mientras se conserva el sujeto principal y la escena natural.\",\"Retro American comic panel with noir mood\":\"Viñeta de cómic estadounidense retro con un ambiente noir\",\"A single comic book panel in a retro American comic style. In the foreground, a masked vigilante leaps across rooftops with their cape flowing. In the background, neon-lit skyscrapers and flying cars streak through the night sky. The panel has a dialogue box with the text \\\"Justice never sleeps.\\\" The lighting creates a dramatic noir mood. 16:9 aspect ratio.\":\"Una viñeta de cómic en estilo retro estadounidense. En el primer plano, un vigilante enmascarado salta entre techos con su capa ondeando. En el fondo, rascacielos iluminados con neón y autos voladores atraviesan el cielo nocturno. La viñeta incluye un cuadro de diálogo con el texto \\\"La justicia nunca duerme\\\". La iluminación crea un ambiente dramático y noir. Proporción de 16:9.\",\"Minimal surreal concept for headphones poster\":\"Concepto surrealista minimalista para cartel de audífonos\",\"\\\"Resonance Headphones\\\" — surreal minimal conceptual advertisement\\n\\nCreate a 1:1 high-resolution poster that reimagines the wireless headphones as a surreal object of desire using minimal elements and symbolic storytelling.\\n\\n• Visual Style: ultra-clean background (light or muted tone), soft lighting, strong negative space\\n• Scene Concept: transform the headphones into floating halos of light suspended in mid-air, with delicate sound waves materializing as golden threads weaving through space\\n• Add a short, punchy slogan (2–3 words) \\\"Pure Escape\\\"\\n• Include the brand's logo in a clean, modern style (integrated naturally into the layout)\\n• Composition: centered or rule-of-thirds alignment, use shadows and depth tastefully\\n• Mood: artistic, elegant, and thought-provoking — like a museum installation\\n• No clutter, no realism overload — just conceptual clarity\":\"\\\"Resonance Headphones\\\" — anuncio conceptual surrealista y minimalista\\n\\nCrea un póster de alta resolución en formato 1:1 que reimagine los audífonos inalámbricos como un objeto surrealista de deseo utilizando elementos mínimos y narración simbólica.\\n\\n• Estilo visual: fondo ultra limpio (tono claro o apagado), iluminación suave, gran uso del espacio negativo\\n• Concepto de escena: transforma los audífonos en halos de luz flotantes suspendidos en el aire, con ondas sonoras delicadas que se materializan como hilos dorados tejiéndose a través del espacio\\n• Añade un eslogan breve e impactante (2-3 palabras) \\\"Escape puro\\\"\\n• Incluye el logotipo de la marca en un estilo limpio y moderno (integrado de manera natural en el diseño)\\n• Composición: alineación centrada o siguiendo la regla de los tercios, usa sombras y profundidad de forma equilibrada\\n• Ambiente: artístico, elegante y reflexivo, como una instalación de museo\\n• Sin desorden, sin exceso de realismo, solo claridad conceptual\",\"Film-style portrait with Saturn model\":\"Retrato de estilo cinematográfico con modelo de Saturno\",\"Close-up. Overhead shot from an extremely high vantage point, extremely low grain with iso100 film shadows on a Lomo LC-A. Realistic depth of field. Artistic composition. Overall bluish tones. Beautiful light and shadows. The black floor with the projected image of the blue sky that fills the screen. A very beautiful European film actress with flowing wavy blonde hair in a black dress shirt sitting cross-legged on the floor. She is wearing a long red skirt. Golden blonde hair catching the light. Defined eyebrows and long lashes. Fair luminous skin. Bright blue eyes that sparkle. A gentle smile. On the floor next to the actress is a white model of Saturn. The picture looks like a scene from a movie.\":\"Primer plano. Toma desde una altura extremadamente elevada, con grano extremadamente bajo y sombras de película ISO100 en una Lomo LC-A. Profundidad de campo realista. Composición artística. Tonos generales azulados. Hermosa luz y sombras. Suelo negro con la imagen proyectada del cielo azul llenando la pantalla. Una actriz europea de cine muy hermosa, de cabello rubio ondulado y fluido, con una camisa negra sentada con las piernas cruzadas en el piso. Ella lleva una falda larga roja. Su cabello rubio dorado brilla a la luz. Cejas definidas y pestañas largas. Piel luminosa y clara. Ojos azules brillantes que destellan. Una suave sonrisa. En el piso junto a la actriz hay un modelo blanco de Saturno. La imagen parece una escena de una película.\",\"Hyper-realistic technical drawing of Fireblade motorcycle\":\"Dibujo técnico hiperrealista de motocicleta Fireblade\",\"Detailed technical drawing of a Honda CBR1000RR-R Fireblade SP, on white paper with dimensions and annotations in red marker. The motorcycle is depicted in pencil with matte black fairings and carbon fiber accents, showing the 999.89cc inline-four engine, ram-air intake system, Öhlins NPX 25/30 front fork, Öhlins TTX36 rear shock, Brembo Stylema front brake calipers, winglets for aerodynamic downforce, quick shifter mechanism, traction control sensors, and titanium Akrapovič exhaust system, all in clear detail. Intricate element, detailed blueprint style with notes on its 217 horsepower output, electronic suspension settings, and MotoGP-derived aerodynamic features and functionality.\":\"Dibujo técnico detallado de una Honda CBR1000RR-R Fireblade SP, en papel blanco con dimensiones y anotaciones en marcador rojo. La motocicleta está representada a lápiz con carenados en negro mate y detalles en fibra de carbono, mostrando el motor de cuatro cilindros en línea de 999.89cc, sistema de admisión ram-air, horquilla delantera Öhlins NPX 25/30, amortiguador trasero Öhlins TTX36, pinzas de freno delanteras Brembo Stylema, alerones para fuerza aerodinámica descendente, mecanismo de cambio rápido, sensores de control de tracción y sistema de escape de titanio Akrapovič, todo en detalle claro. Elementos intrincados, estilo detallado de plano técnico con notas sobre sus 217 caballos de fuerza, configuraciones de suspensión electrónica y características aerodinámicas derivadas de MotoGP.\",\"Editorial male skincare portrait concept\":\"Concepto de retrato editorial para cuidado de la piel masculina\",\"Create a closeup face of a young man after using skincare products, glowing skin, warm hazel eyes, with a bit of blurred bathroom mirror background on the right side of the photo, 5:3 proportions, he's looking confidently at the camera, natural skin texture and tousled hair, handsome, editorial style for \\\"PureGlow Men's Skincare\\\" brand landing page\":\"Crea un primer plano del rostro de un joven después de usar productos para el cuidado de la piel, con piel radiante, ojos cálidos color avellana, un fondo ligeramente difuminado de un espejo de baño a la derecha de la foto, proporciones 5:3. Mira con confianza a la cámara, con textura natural de piel y cabello despeinado, atractivo, estilo editorial para la página de inicio de la marca \\\"PureGlow Men's Skincare\\\".\",\"Hyper-realistic editorial concept for perfume ad\":\"Concepto editorial hiperrealista para anuncio de perfume\",\"A hyper-realistic editorial concept for a collaboration between Lumière Parfums and Élite Fashion Magazine. Square 1:1 composition, shot in a sleek Parisian interior with marble floors and tall windows, golden afternoon light illuminating the scene. A single model in a couture gown poses gracefully beside a realistically sized Lumière Parfums perfume bottle with the Lumière logo clearly visible placed on a marble pedestal. Ultra-refined textures, cinematic realism, Vogue-style photography.\":\"Un concepto editorial hiperrealista para una colaboración entre Lumière Parfums y Élite Fashion Magazine. Composición cuadrada 1:1, fotografiada en un elegante interior parisino con pisos de mármol y ventanas altas, luz dorada de la tarde iluminando la escena. Una sola modelo con un vestido de alta costura posa elegantemente junto a un frasco de perfume Lumière Parfums de tamaño realista, con el logotipo de Lumière claramente visible, colocado sobre un pedestal de mármol. Texturas ultra refinadas, realismo cinematográfico, fotografía al estilo de Vogue.\",\"Futuristic biomorphic sculpture of digital lion\":\"Escultura biomórfica futurista de león digital\",\"a futuristic 3D-rendered lion made of translucent golden inner structure encased in a smooth white exoskeleton with organic holes and flowing biomorphic patterns, floating in a minimal soft gray background, high contrast lighting, hyperrealistic materials, octane render, modern digital sculpture\":\"Un león futurista creado en 3D con una estructura interna dorada translúcida envuelta en un exoesqueleto blanco suave con agujeros orgánicos y patrones biomórficos fluidos, flotando en un fondo minimalista gris suave, iluminación de alto contraste, materiales hiperrealistas, renderizado con Octane, escultura digital moderna.\",\"3D caricature of Einstein\":\"Caricatura 3D de Einstein\",\"Hyper-realistic 3D caricature of Albert Einstein, featuring an expressive, oversized head, a short body, and a detailed, energetic facial expression. Wearing a rumpled gray sweater vest over a white shirt with wild white hair and mustache, striking a thoughtful pose with one finger raised as if having a eureka moment. Studio lighting, cartoonish proportions, Pixar-style 3D rendering, ultra-detailed fabric and skin textures. The body is slightly smaller than the head. 1080x1080 square format.\":\"Caricatura 3D hiperrealista de Albert Einstein, con una cabeza grande y expresiva, un cuerpo corto y una expresión facial detallada y enérgica. Lleva un chaleco gris arrugado sobre una camisa blanca, cabello blanco desordenado y bigote, y adopta una pose reflexiva con un dedo levantado como si tuviera un momento de eureka. Iluminación de estudio, proporciones caricaturescas, renderizado 3D al estilo Pixar, texturas ultra detalladas de tela y piel. El cuerpo es ligeramente más pequeño que la cabeza. Formato cuadrado 1080x1080.\",\"Cinematic food ad of gourmet cheeseburger\":\"Anuncio cinematográfico de hamburguesa gourmet\",\"Smooth 3D hyperrealistic food advertisement of a gourmet cheeseburger, shown with mouthwatering glossy textures and perfect lighting, placed on a dark moody surface with soft glow and cinematic blur in the background, high Kelvin lighting for golden highlights and sharp shadows, backlit to show delicious steam and dripping sauces, behind the food a bold slogan in elegant font with three words only \\\"Taste Pure Perfection\\\", restaurant logo \\\"Golden Bite Bistro\\\" subtly placed on the plate or in the corner, rich color grading with appetite-inducing tones, ultra sharp, professional food styling, stylized render\":\"Anuncio suave en 3D hiperrealista de una hamburguesa gourmet, con texturas brillantes y apetitosas y una iluminación perfecta, colocada sobre una superficie oscura con un suave resplandor y un desenfoque cinematográfico en el fondo. Iluminación de alto Kelvin para reflejos dorados y sombras definidas, retroiluminado para mostrar vapor delicioso y salsas que gotean. Detrás de la comida, un eslogan audaz en una elegante tipografía con solo tres palabras: \\\"Disfruta la Perfección Pura\\\". El logotipo del restaurante \\\"Golden Bite Bistro\\\" colocado sutilmente en el plato o en una esquina. Grado de color rico con tonos que abren el apetito, ultra nítido, estilismo profesional de alimentos, renderizado estilizado.\",\"Playful ice-sculpture artwork of Marina Bay Sands\":\"Escultura de hielo lúdica de Marina Bay Sands\",\"A colorful handcrafted sculpture of Marina Bay Sands, made from semi-transparent ice blocks in custom shapes. Accents like icing, candy, yarn, or fruit skin enhance the iconic infinity pool, three towers, and SkyPark details. Placed on a ceramic plate over a leaf or decorative mat, with a clean, softly lit studio or natural tabletop background. Lighting highlights the glossy ice texture, blending food art, toy design, and photography into a playful, artistic composition.\":\"Una colorida escultura artesanal de Marina Bay Sands, hecha con bloques de hielo semitransparentes en formas personalizadas. Detalles como glaseado, dulces, hilo o cáscara de fruta realzan la icónica piscina infinita, las tres torres y los detalles del SkyPark. Colocada en un plato de cerámica sobre una hoja o un tapete decorativo, con un fondo limpio de estudio suavemente iluminado o una superficie natural. La iluminación resalta la textura brillante del hielo, combinando arte culinario, diseño de juguetes y fotografía en una composición artística y divertida.\",\"Caesar salad infographic recipe\":\"Receta infográfica de ensalada César\",\"Create step-by-step recipe infographic for classic chicken Caesar salad, top-down view, minimal style on white background, ingredient photos labeled: \\\"2 chicken breasts\\\", \\\"1 romaine lettuce head\\\", \\\"1/2 cup parmesan\\\", \\\"1/4 cup croutons\\\", \\\"2 tbsp Caesar dressing\\\", \\\"1 lemon\\\", \\\"black pepper\\\", dotted lines showing process steps with icons (grill pan, chopping board, mixing bowl), final plated salad shot at the bottom\":\"Crea una receta infográfica paso a paso para una ensalada César de pollo clásica, vista desde arriba, estilo minimalista sobre fondo blanco. Fotos de los ingredientes etiquetadas: \\\"2 pechugas de pollo\\\", \\\"1 lechuga romana\\\", \\\"1/2 taza de parmesano\\\", \\\"1/4 taza de crutones\\\", \\\"2 cucharadas de aderezo César\\\", \\\"1 limón\\\", \\\"pimienta negra\\\". Líneas punteadas muestran los pasos del proceso con íconos (sartén para asar, tabla de cortar, tazón para mezclar), con la foto final de la ensalada servida al final.\",\"Travel insurance conceptual ad\":\"Anuncio conceptual de seguro de viaje\",\"Create creative travel insurance ad, show a paper airplane unfolding into a protective umbrella mid-flight, with tiny travelers safely underneath, tagline: \\\"Coverage that travels with you.”\":\"Crea un anuncio creativo de seguro de viaje, muestra un avión de papel que se despliega en un paraguas protector mientras vuela, con pequeños viajeros seguros debajo, lema: \\\"Cobertura que viaja contigo.\\\"\",\"Generate cinematic video of astronaut on moon\":\"Generar un video cinematográfico de un astronauta en la luna\",\"Please generate a Cinematic video of an astronaut walking alone on the moon.\\nWide establishing shot with low-angle sunlight casting long shadows.\\nSlow tracking shot follows the astronaut's boots pressing into lunar dust.\\nCut to over-the-shoulder shot as they spot a black, polished stone embedded in the ground.\\nClose-up: astronaut's gloved hand slowly lifts the stone.\\nInsert shot: extreme close-up of the stone surface — initially matte and dusty. As light hits at the right angle, the engraved word \\\"hello world\\\" in elegant serif font gradually reveals itself, shimmering under soft rim light.\\nUse animated texture transition: from rough lunar dust to glossy, etched surface.\\nFinal shot: gentle push-in on the glowing serif letters as ambient space sound hums.\\nUse shallow depth of field, cinematic lighting, and slow-motion at key beats.\":\"Por favor, genera un video cinematográfico de un astronauta caminando solo en la luna.\\nToma amplia inicial con luz solar en ángulo bajo proyectando largas sombras.\\nToma de seguimiento lenta que muestra las botas del astronauta presionando el polvo lunar.\\nCambio a toma por encima del hombro cuando descubre una piedra negra pulida incrustada en el suelo.\\nPrimer plano: la mano enguantada del astronauta levanta la piedra lentamente.\\nPlano insertado: toma de primerísimo plano de la superficie de la piedra — al principio mate y polvorienta. A medida que la luz incide en el ángulo correcto, las palabras grabadas \\\"hello world\\\" en elegante tipografía serif gradualmente se revelan, brillando bajo una suave luz de contorno.\\nUsa una transición animada de textura: del polvo lunar áspero a la superficie grabada y brillante.\\nToma final: acercamiento suave a las letras brillantes en serif mientras se oye un sonido ambiente espacial.\\nUsa poca profundidad de campo, iluminación cinematográfica y cámara lenta en momentos clave.\",\"Create a TikTok-like short video platform for \\\"Classic of Mountains and Seas\\\" creatures\":\"Crear una plataforma de videos cortos similar a TikTok para las criaturas del \\\"Clásico de Montañas y Mares\\\"\",\"Create a short video platform featuring mythical creatures from China's \\\"Classic of Mountains and Seas\\\" (Shan Hai Jing), with vertical scrolling, autoplay, and creature information display to deliver a TikTok-like browsing experience. You need to produce short videos of several seconds for each creature, including visual design, animated movements, and custom sound effects. Requires responsive web design and permanent cloud deployment.\":\"Crea una plataforma de videos cortos dedicada a las criaturas míticas del \\\"Clásico de Montañas y Mares\\\" (Shan Hai Jing) de China, con desplazamiento vertical, reproducción automática y una sección informativa para cada criatura, ofreciendo una experiencia similar a TikTok. Necesitas producir videos cortos de varios segundos para cada criatura, incluyendo diseño visual, movimientos animados y efectos de sonido personalizados. Requiere diseño web responsivo y despliegue en la nube permanente.\",\"Generate detective-rubber duck interrogation video\":\"Generar un video de interrogatorio de un detective y un pato de goma\",\"Generate video A detective interrogates a nervous-looking rubber duck. \\\"Where were you on the night of the bubble bath?!\\\" he quacks. Audio: Detective's stern quack, nervous squeaks from rubber duck.\":\"Genera un video donde un detective interroga a un pato de goma que parece nervioso. \\\"¿Dónde estabas la noche del baño de burbujas?!\\\" grazna el detective. Audio: el graznido severo del detective y los chirridos nerviosos del pato de goma.\",\"Animate Vincent van Gogh's Starry Night into cinematic short video\":\"Animar \\\"La noche estrellada\\\" de Vincent van Gogh en un video corto cinematográfico\",\"Please generate a cinematic short video (aspect ratio 16:9) that brings Vincent van Gogh's Starry Night (1889) to life through fluid, immersive animation. The focus should be on animating the swirling night sky, evoking a sense of motion, emotion, and cosmic energy.\":\"Por favor, genera un corto cinematográfico (relación de aspecto 16:9) que dé vida a la \\\"Noche Estrellada\\\" (1889) de Vincent van Gogh mediante una animación fluida e inmersiva. El enfoque debe ser animar el cielo nocturno en espiral, evocando una sensación de movimiento, emoción y energía cósmica.\",\"Design and showcase a dress in an explosion scene\":\"Diseñar y mostrar un vestido en una escena de explosión\",\"Please design a dress that seamlessly blends edgy, avant-garde, and fashionable elements, then create a video showcasing a stunning female model wearing this dress as she emerges from the ruins of an explosion scene, with crashed and burning cars or other explosive debris in the background. The model should have subtle dirt and grime on her face to enhance the dramatic tension. The video should utilize multiple camera angles to comprehensively showcase the garment's silhouette design, fit, fabric texture, and dynamic flow. As final deliverables, please provide detailed design sketches of the dress and a complete model showcase video.\":\"Por favor, diseña un vestido que combine perfectamente elementos audaces, vanguardistas y elegantes. Luego, crea un video donde una impactante modelo femenina luce el vestido mientras emerge de las ruinas de una escena de explosión, con autos chocados y en llamas u otros escombros explosivos en el fondo. La modelo debe tener sutiles rastros de suciedad en su rostro para intensificar la tensión dramática. El video debe utilizar múltiples ángulos de cámara para mostrar de manera integral el diseño del vestido, el ajuste, la textura de la tela y su flujo dinámico. Como entregables finales, proporciona bocetos detallados del diseño del vestido y un video completo de la presentación de la modelo.\",\"Generate video of owl's forest adventure\":\"Generar un video de la aventura en el bosque de un búho\",\"Generate a Video：A follow shot of a wise old owl high in the air, peeking through the clouds in a moonlit sky above a forest. The wise old owl carefully circles a clearing looking around to the forest floor. After a few moments, it dives down to a moonlit path and sits next to a badger. Audio: wings flapping, birdsong, loud and pleasant wind rustling and the sound of intermittent pleasant sounds buzzing, twigs snapping underfoot, croaking. A light orchestral score with woodwinds throughout with a cheerful, optimistic rhythm, full of innocent curiosity.\":\"Generar un video: Un seguimiento de una sabia lechuza volando alto en el aire, espiando a través de las nubes en un cielo iluminado por la luna sobre un bosque. La sabia lechuza da vueltas cuidadosamente alrededor de un claro observando el suelo del bosque. Después de unos momentos, se lanza hacia un sendero iluminado por la luna y se sienta junto a un tejón. Audio: aleteo de alas, canto de aves, viento agradable y fuerte susurrando, el sonido intermitente de zumbidos placenteros, ramas rompiéndose bajo los pies, croar de ranas. Una partitura orquestal ligera con instrumentos de viento madera durante toda la escena, con un ritmo alegre y optimista, lleno de curiosidad inocente.\",\"Generate a video of a cartographer in a historical adventure setting\":\"Generar un video de un cartógrafo en un contexto de aventura histórica\",\"Generate a Video：A medium shot, historical adventure setting: Warm lamplight illuminates a cartographer in a cluttered study, poring over an ancient, sprawling map spread across a large table.\":\"Generar un video: Un plano medio, entorno de aventura histórica: Una luz cálida de lámpara ilumina a un cartógrafo en un estudio desordenado, concentrado en un mapa antiguo y extenso desplegado sobre una gran mesa.\",\"Generate a video of an elderly sailor looking at spaghetti by the sea\":\"Generar un video de un anciano marinero mirando espaguetis junto al mar\",\"Generate a video: Open with a medium shot, eye-level, of Character A, an elderly Caucasian sailor with weathered skin, deep wrinkles, and a kindly face. He wears a faded, knitted blue sailor hat that casts a shadow over his eyes, and a thick grey beard that obscures his chin and neck. His blue eyes are peering down at a giant white ceramic plate of spaghetti placed on a railing. The spaghetti is topped with a vibrant red sauce and a sprinkle of fresh parsley. The background is a softly blurred seascape with a pier visible, suggesting a working dock on a sunny day. The overall atmosphere is nostalgic and warm, achieved with soft and natural lighting. The style is realistic, with a touch of cinematic quality. On his sweater, this is an embroidered word that reads, \\\"it's me\":\"Generar un video: Comienza con un plano medio, a nivel de los ojos, del personaje A, un marinero caucásico anciano con piel curtida, arrugas profundas y un rostro amable. Lleva un desvencijado gorro azul de marinero tejido que proyecta una sombra sobre sus ojos, y una espesa barba gris que oculta su barbilla y cuello. Sus ojos azules miran hacia un enorme plato blanco de cerámica de espaguetis colocado en una barandilla. Los espaguetis están cubiertos con una vibrante salsa roja y una pizca de perejil fresco. El fondo es un paisaje marítimo ligeramente desenfocado con un muelle visible, sugiriendo un puerto de trabajo en un día soleado. La atmósfera general es nostálgica y cálida, lograda con iluminación suave y natural. El estilo es realista, con un toque de calidad cinematográfica. En su suéter, está bordada la frase: \\\"it's me\\\".\",\"Generate an animated video telling the story of Little Red Riding Hood\":\"Generar un video animado que cuente la historia de Caperucita Roja\",\"Generate an animated video within 30 seconds with a warm and bright color tone. The storyboard is as follows: Opening: The forest emerges gradually from the morning mist, and Little Red Riding Hood runs in from the right side carrying a basket filled with cakes and fruits. Development: Little Red Riding Hood sings in the forest while the Big Bad Wolf squints and chuckles behind a tree. Then, Little Red Riding Hood talks to the wolf disguised as Grandma. Climax: The hunter bursts through the door with a gun, and the wolf escapes through the window. Ending: Little Red Riding Hood, Grandma, and the hunter wave in front of Grandma's house.\":\"Generar un video animado de 30 segundos con tonos cálidos y brillantes. El guion gráfico es el siguiente: Apertura: El bosque emerge gradualmente de la niebla matutina y Caperucita Roja entra corriendo desde el lado derecho, llevando una cesta llena de pasteles y frutas. Desarrollo: Caperucita Roja canta en el bosque mientras el Lobo Feroz entrecierra los ojos y se ríe detrás de un árbol. Luego, Caperucita Roja habla con el lobo disfrazado de abuela. Clímax: El cazador irrumpe por la puerta con un arma, y el lobo escapa por la ventana. Final: Caperucita Roja, la abuela y el cazador saludan frente a la casa de la abuela.\",\"Design a stylized fantasy world game concept\":\"Diseñar un concepto de juego estilizado de mundo de fantasía\",\"I am working on a stylized fantasy world game concept design project, with the goal of constructing a fictional continent composed of seven distinct terrains. The overall style should be quiet, abstract, and slow-paced. The visual presentation adopts the stylized art style commonly used in games, with refined and clear imagery, using flat-shaded lighting and well-defined shapes, avoiding overly realistic styles. The seven regions include: High Prairie, Wind-Eroded Dunes, Floating Ridge Clusters, Mistlight Marsh, Rift Shell, Dusk Shoal Isles, and Mindstill Plain. Each region should feature a short video and an atmosphere description that reflect its spatial rhythm, natural motion, and emotional color palette. In addition to natural elements, each scene should include architectural ruins as visual anchors to enrich structural layers and enhance the sense of space. Character design is divided into two types. The first is the main character — a single figure exploring the world. The second type includes 1 NPC within each region. Each character should have a standing illustration, accompanied by a single abstract phrase that hints at their function and behavioral intention within the game. All content will be integrated into an artistic webpage, including an overall worldview, an interactive fantasy map showing the relative positions of the seven regions, and individual entrances for each area displaying its visuals, video, and atmosphere text. Character illustrations and descriptions will also be presented alongside. The overall webpage design should maintain spaciousness and a clear structure.\":\"$10\",\"Generate video clips of surreal train arrival and TV revelation\":\"Generar clips de video de una llegada de tren surrealista y una revelación en televisión\",\"Generate 2 video clips -- Scene 1: A historically grounded, slightly surreal recreation of the famous \\\"Arrival of a Train\\\" moment. In a dimly lit French café in 1895, dozens of curious patrons sit tightly packed on wooden chairs, watching a black-and-white film projected onto a white cloth screen stretched over a wooden frame. A young English-speaking narrator — a man in round spectacles and a dusty formal suit — stands beside the screen, addressing the audience in dramatic English. Gesturing toward the film, he declares: \\\"The miracle begins now ... Manus is here!\\\" The film shows a steam train approaching a station. As it nears the camera, the screen splinters — the fabric tears open, and a full-size steam train crashes through, bursting from a hidden tunnel behind the projection setup. Dust and debris fill the room. Screws, fabric, and wood scatter. It feels like the café's back wall has exploded. Patrons scream, dive for cover, topple chairs. The narrator stumbles and falls. After a beat, he gets up slowly, brushes off his coat, and stares ahead, wide-eyed and speechless. Style note: Visually immersive with realistic destruction. All action should follow believable physics. Humor comes from the serious tone applied to an obviously absurd situation.  Scene2: The same narrator from Scene 1 — only his body is visible. Same glasses, same dusty suit. Warm light slowly rises. The camera starts wide: the same French café from before, now emptied, quiet as ash. Everything is still. The dust has settled. At the center of the room stands a modern-looking table, stark and alone, like it doesn't belong to this era. Resting on it is an old-fashioned television set — closed, smooth, almost ceremonial. A red cloth half-covers it, like a veil waiting to be lifted. The narrator enters slowly, but his face is never shown — the camera stays low or behind him, framing only his body from the shoulders down. His footsteps echo. The camera tracks him as he walks toward the table — a slow, deliberate approach. As he reaches the television, the shot tightens — still no head in frame. He pauses. Then, with care, he lifts the cloth. The screen powers on, glowing pure white. The camera continues to push in — inching closer — until the screen fills the frame. From off-camera, calmly and with weight, the narrator speaks: \\\"What comes next… is Veo3 — inside Manus. Let me show you.\\\" The white screen pulses slightly with light, leaving space for overlaid titles or transitions into the next segment.\":\"$11\",\"Create Ultraman vs alien battle video\":\"Crear un video de batalla entre Ultraman y extraterrestres\",\"Create a dynamic video (less than 30 seconds): Ultraman, with his iconic glowing Spacium Beam, battles a menacing alien invader. The alien has a grotesque, tentacled form and emits eerie energy. Set in a crumbling urban landscape, with flashing lights and debris flying. Capture the intense clash of powers, Ultraman's heroic stance, and the alien's frantic counterattacks, ending with a thrilling close-call moment before Ultraman gains the upper hand.\":\"Crea un video dinámico (menos de 30 segundos): Ultraman, con su icónico rayo luminiscente Spacium, lucha contra un amenazante invasor alienígena. El alienígena tiene una forma grotesca, tentáculos y emite energía inquietante. Ambientado en un paisaje urbano en ruinas, con luces parpadeantes y escombros volando. Captura el intenso choque de poderes, la postura heroica de Ultraman y los frenéticos contraataques del alienígena, terminando con un emocionante momento de peligro antes de que Ultraman tome la ventaja.\",\"Generate an NBA Finals night video\":\"Generar un video de la noche de las Finales de la NBA\",\"Generate a video depicting the scene on the NBA Finals night: The arena is brightly lit like daytime. The purple-gold and dark-blue interlaced LED panels surge around. The flashes from the audience's mobile phones twinkle like a galaxy. In the reflection of the floor, the figure of the small-stature ball-handling guard is shown. He starts with a low center of gravity, sweat glistening under the cold white ceiling lights. The friction sound between the sole of his shoe and the wooden floor is amplified, like drawing a bow to store energy; the shoulder-mounted camera follows him as he glides through the three-second zone. The next moment, it cuts to an ultra-slow-motion shot under the basket —— he seems to be ejected off the ground. In the backlight, his silhouette soars, the arm draws a full arc. The slight tremor of the rim's metal chain is stretched. The surrounding noise suddenly goes vacuum. The basketball smashes into the hoop heavily, the rim shakes violently. The camera rushes into the audience seats. Waving arms and splashing popcorn explode in slow-motion trails; from the overhead perspective, the LED effects sweep across the scoreboard like fireworks. The commentator shouts \\\"AND-ONE!\\\" —— The wave-like cheers suddenly stop at the end of eight seconds, leaving only the low-frequency heartbeat that makes the chest tremble.\":\"$12\",\"Create a video of a wild boar running in the forest\":\"Crear un video de un jabalí corriendo en el bosque\",\"Create a dynamic video clip: A wild boar, with its sturdy body and bristly fur, runs energetically through a dense forest. Sunlight filters through the tree canopy, dappling the ground and the boar's form. The forest is filled with tall, swaying trees, rustling leaves, and the soft crunch of undergrowth under its hooves. Capture the boar's powerful strides, the natural forest ambiance, and the sense of wild freedom as it dashes along the winding path.\":\"Crea un video dinámico: Un jabalí, con su cuerpo robusto y pelaje erizado, corre enérgicamente a través de un bosque denso. La luz del sol se filtra a través del dosel de los árboles, salpicando de sombras el suelo y la figura del jabalí. El bosque está lleno de altos árboles balanceándose, hojas que crujen al ser movidas y el suave crujido del sotobosque bajo sus pezuñas. Captura las potentes zancadas del jabalí, la atmósfera natural del bosque y la sensación de libertad salvaje mientras corre por el sinuoso sendero.\",\"Create a video of a comedian sharing dating anecdotes\":\"Crear un video de un comediante compartiendo anécdotas de citas\",\"Create a video: A stand-up comedian, dressed in casual yet eye-catching clothes, stands on a simple stage with a microphone. The background is a cozy, dimly-lit comedy club, with rows of audience seats filled with people of diverse ages, all ready to laugh. The comedian is sharing hilarious anecdotes about the chaos of modern dating — the time he tried to use a food-related pickup line at a vegan restaurant, only to get an awkward silence and a side-eye from the server. His gestures are exaggerated, facial expressions shift from confused to mock-offended, and the audience reacts enthusiastically, with some clapping and others covering their mouths to stifle giggles. Focus on capturing the lively atmosphere of the comedy club and the comedian's engaging storytelling.\":\"Crea un video: Un comediante de stand-up, vestido con ropa casual pero llamativa, está en un escenario sencillo con un micrófono. El fondo es un club de comedia acogedor y tenuemente iluminado, con filas de asientos llenos de personas de diversas edades, todos listos para reír. El comediante comparte anécdotas hilarantes sobre el caos de las citas modernas: como la vez que intentó usar una frase de ligue relacionada con comida en un restaurante vegano, obteniendo solo un incómodo silencio y una mirada de reojo del camarero. Sus gestos son exagerados, las expresiones faciales cambian de confusión a ofensa fingida, y la audiencia reacciona entusiasmada, algunos aplaudiendo y otros cubriéndose la boca para contener las risas. Concéntrate en capturar la animada atmósfera del club de comedia y el cautivador relato del comediante.\",\"Generate a podcast and instantly publish it on a live website.\":\"Genera un pódcast y publícalo instantáneamente en un sitio web en vivo.\",\"Based on this paper https://web.stanford.edu/class/psych209/Readings/SuttonBartoIPRLBook2ndEd.pdf, create a podcast for me that explains the content clearly and engagingly.\":\"Basado en este documento https://web.stanford.edu/class/psych209/Readings/SuttonBartoIPRLBook2ndEd.pdf, crea un pódcast para mí que explique el contenido de manera clara y atractiva.\",\"Create an illustrated comic webpage with narration.\":\"Crea una página web de cómic ilustrado con narración.\",\"Help me create a hand-drawn comic book webpage about the three most important artifacts in the British Museum. This webpage should have page-turning functionality, vivid illustrations, and background audio narration.\":\"Ayúdame a crear una página web de cómic dibujada a mano sobre los tres artefactos más importantes del Museo Británico. Esta página debe tener funcionalidad de pasar páginas, ilustraciones llamativas y narración de audio de fondo.\",\"Summarize yesterday's AI news into a 7-minute energetic audio show.\":\"Resume las noticias de IA de ayer en un programa de audio de 7 minutos lleno de energía.\",\"Summarize yesterday's AI news and create a roughly 7-minute broadcast that is energetic, informative, and engaging. I will listen to it on the subway.\":\"Resume las noticias de IA de ayer y crea un programa de aproximadamente 7 minutos que sea enérgico, informativo y atractivo. Lo escucharé en el metro.\",\"Produce a lively, friendly English female voiceover for a product script.\":\"Produce una voz femenina en inglés animada y amistosa para un guion de producto.\",\"This is our YouTube product feature promotional video script. Please help me create an energetic and engaging standard English voiceover from the script provided, requiring a female voice that sounds natural and friendly： Want stunning store posters? Stop designing from scratch.\\nJust tell our AI your store type, style, and key message. In seconds, you get a ready-to-use, eye-catching poster — complete with colors, fonts, and layout that match your brand.\\nQuick, smart, and totally shareable.\\nCreate your poster today. It’s that easy.\":\"Este es nuestro guion para un video promocional de características de productos de YouTube. Por favor, ayúdame a crear una narración en inglés estándar, enérgica y atractiva a partir del guion proporcionado, que requiera una voz femenina que suene natural y amigable: ¿Quieres pósters impresionantes para tu tienda? Deja de diseñar desde cero.\\nSolo dile a nuestra IA el tipo, estilo y mensaje clave de tu tienda. En segundos, obtendrás un póster listo para usar y llamativo, con colores, fuentes y diseño que coinciden con tu marca.\\nRápido, inteligente y totalmente compartible.\\nCrea tu póster hoy mismo. Es así de fácil.\",\" prensión general. Por favor, proporcióname el audio.\",\"Generate a calming 5-minute ocean meditation audio session for relaxation.\":\"Genera una sesión de audio calmante de 5 minutos de meditación con sonido de océano para la relajación.\",\"My name is Woody, help me generate a 5-minute meditation guidance audio with ocean wave background sounds. Need a soothing, light voice.\":\"Me llamo Woody, ayúdame a generar un audio de guía de meditación de 5 minutos con sonidos de fondo de olas del océano. Necesito una voz suave y relajante.\",\"Transform a technical article into an engaging, complete audio podcast.\":\"Convierte un artículo técnico en un podcast de audio completo y atractivo.\",\"Turn this article into a podcast without losing any information, making it clear and engaging: https://karpathy.github.io/2021/03/27/forward-pass/\":\"Convierte este artículo en un podcast asegurando que no se pierda información, haciéndolo claro y atractivo: https://karpathy.github.io/2021/03/27/forward-pass/\",\"Track personal finances with daily logs and categories\":\"Registrar las finanzas personales con registros diarios y categorías\",\"Create a personal finance management system with categories: salary, goals, expenses, living costs, investments, and entertainment. Include daily expense tracking functionality.\":\"Crea un sistema de gestión financiera personal con categorías: salario, metas, gastos, costos de vida, inversiones y entretenimiento. Incluye funcionalidad para rastreo diario de gastos.\",\"Build 10-year Europe EV revenue and penetration table\":\"Construir una tabla de ingresos y penetración de vehículos eléctricos en Europa a 10 años\",\"Generate a 10-year trend table showing Europe electric vehicle industry revenue and market penetration rates.\":\"Genera una tabla de tendencias a 10 años que muestre los ingresos y tasas de penetración de mercado de la industria de vehículos eléctricos en Europa.\",\"Compile 2025 North America AI conference calendar\":\"Compi cture of government budget expenditure in 2024 (education, health, defense, infrastructure) for OECD countries.\":\"Usa un gráfico de árbol para ilustrar la estructura del gasto presupuestario gubernamental en 2024 (educación, salud, defensa, infraestructura) para los países de la OCDE.\",\"Use heatmap to display monthly AQI of major world cities\":\"Usa un mapa de calor para mostrar el AQI mensual de las principales ciudades del mundo\",\"Use Heatmap to display the average air quality index (AQI) of major world cities in 2024 across months, using WHO or IQAir data.\":\"Utiliza un mapa de calor para mostrar el índice promedio de calidad del aire (AQI) de las principales ciudades del mundo en 2024 a lo largo de los meses, utilizando datos de la OMS o IQAir.\",\"Use box plot to compare household income across EU\":\"Usa un diagrama de caja para comparar los ingresos de los hogares en la UE\",\"Use box plot to compare income distribution (GINI-adjusted household income) across EU countries in 2024, showing median and outlier values.\":\"Utiliza un diagrama de caja para comparar la distribución de los ingresos (ingresos del hogar ajustados por GINI) en los países de la UE en 2024, mostrando valores medianos y atípicos.\",\"Compare performance and stock price of three banks\":\"Compara el desempeño y el precio de las acciones de tres bancos\",\"Compare the performance and stock price of three major banks from Q1 2024 to Q1 2025 in an Excel spreadsheet. Include: (1) Income Statement: revenue, net interest margin (NIM), net profit by quarter; (2) Balance Sheet: total assets, total liabilities, capital adequacy ratio; (3) Stock Price \u0026 Returns: closing price each quarter, quarter-over-quarter change, year-over-year change; (4) Valuation Metrics: book value per share (BVPS), price-to-book ratio (P/B), dividend yield.\":\"Compara el desempeño y el precio de las acciones de tres bancos principales desde el Q1 de 2024 hasta el Q1 de 2025 en una hoja de cálculo de Excel. In
