:root {
  --bprogress-color: #0081f2;
  --bprogress-height: 2px;
  --bprogress-spinner-size: 18px;
  --bprogress-spinner-animation-duration: 400ms;
  --bprogress-spinner-border-size: 2px;
  --bprogress-box-shadow: 0 0 10px #0081f2, 0 0 5px #0081f2;
  --bprogress-z-index: 99999;
  --bprogress-spinner-top: 15px;
  --bprogress-spinner-bottom: auto;
  --bprogress-spinner-right: 15px;
  --bprogress-spinner-left: auto;
}

.bprogress {
  pointer-events: none;
  z-index: var(--bprogress-z-index);
}

.bprogress .bar {
  background: var(--bprogress-color);
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
}

/* Fancy blur effect */
.bprogress .peg {
  display: block;
  position: absolute;
  right: 0;
  width: 100px;
  height: 100%;
  box-shadow: var(--bprogress-box-shadow);
  opacity: 1.0;
  transform: rotate(3deg) translate(0px, -4px);
}

/* Remove these to get rid of the spinner */
.bprogress .spinner {
  display: block;
  position: fixed;
  z-index: var(--bprogress-z-index);
  top: var(--bprogress-spinner-top);
  bottom: var(--bprogress-spinner-bottom);
  right: var(--bprogress-spinner-right);
  left: var(--bprogress-spinner-left);
}

.bprogress .spinner-icon {
  width: var(--bprogress-spinner-size);
  height: var(--bprogress-spinner-size);
  box-sizing: border-box;
  border: solid var(--bprogress-spinner-border-size) transparent;
  border-top-color: var(--bprogress-color);
  border-left-color: var(--bprogress-color);
  border-radius: 50%;
  -webkit-animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
  animation: bprogress-spinner var(--bprogress-spinner-animation-duration) linear infinite;
}

.bprogress-custom-parent {
  overflow: hidden;
  position: relative;
}

.bprogress-custom-parent .bprogress .spinner,
.bprogress-custom-parent .bprogress .bar {
  position: absolute;
}

.bprogress .indeterminate {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--bprogress-height);
  overflow: hidden;
}

.bprogress .indeterminate .inc,
.bprogress .indeterminate .dec {
  position: absolute;
  top: 0;
  height: 100%;
  background-color: var(--bprogress-color);
}

.bprogress .indeterminate .inc {
  animation: bprogress-indeterminate-increase 2s infinite;
}

.bprogress .indeterminate .dec {
  animation: bprogress-indeterminate-decrease 2s 0.5s infinite;
}

@-webkit-keyframes bprogress-spinner {
  0%   { -webkit-transform: rotate(0deg); transform: rotate(0deg); }
  100% { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
}

@keyframes bprogress-spinner {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

@keyframes bprogress-indeterminate-increase {
  from { left: -5%; width: 5%; }
  to { left: 130%; width: 100%; }
}

@keyframes bprogress-indeterminate-decrease {
  from { left: -80%; width: 80%; }
  to { left: 110%; width: 10%; }
}

 vapor a tamaño real atraviesa, emergiendo de un túnel oculto detrás del montaje de proyección. Polvo y escombros llenan la habitación. Tornillos, tela y madera se dispersan. Parece como si la pared trasera del café hubiese explotado. Los clientes gritan, se lanzan al suelo, vuelcan sillas. El narrador tropieza y cae. Tras una pausa, se levanta lentamente, se sacude el abrigo y mira al frente, con los ojos abiertos de par en par y sin palabras. Nota de estilo: Visualmente inmersivo con destrucción realista. Todas las acciones deben seguir las leyes físicas respetables. El humor proviene del tono serio aplicado a una situación claramente absurda. Escena 2: El mismo narrador de la Escena 1 — sólo su cuerpo es visible. Mismas gafas, mismo traje polvoriento. Una cálida luz se eleva lentamente. La cámara comienza desde una toma amplia: el mismo café francés de antes, ahora vacío, tranquilo como cenizas. Todo está inmóvil. El polvo se ha asentado. En el centro de la habitación hay una mesa de estilo moderno, solitaria, destacando como si no perteneciera a esta era. Sobre ella descansa un televisor de estilo antiguo — cerrado, liso, casi ceremonial. Una tela roja lo cubre parcialmente, como un velo que espera ser levantado. El narrador entra lentamente, pero su rostro nunca se muestra — la cámara se mantiene baja o detrás de él, encuadrando sólo su cuerpo desde los hombros hacia abajo. Sus pasos resuenan. La cámara lo sigue mientras camina hacia la mesa — un acercamiento lento y deliberado. Al llegar al televisor, el plano se estrecha — todavía sin mostrar la cabeza en cuadro. Se detiene. Luego, con cuidado, levanta la tela. La pantalla se enciende, brillando de blanco puro. La cámara sigue avanzando — acercándose — hasta que la pantalla ocupa todo el encuadre. Fuera de cámara, con calma y peso, el narrador dice: \"Lo que sigue… es Veo3 — dentro de Manus. Déjame mostrártelo.\" La pantalla blanca pulsa ligeramente con luz, dejando espacio para títulos superpuestos o transiciones hacia el siguiente segmento."])</script><script>self.__next_f.push([1,"12:T5da,Genera un video que represente la escena de la noche de las Finales de la NBA: La arena está iluminada como si fuera de día. Los paneles LED púrpura-dorados y azul-oscuro se entrecruzan y parpadean alrededor. Los destellos de los teléfonos móviles del público brillan como una galaxia. En el reflejo del suelo, se muestra la figura del base controlador de estatura pequeña. Comienza con un centro de gravedad bajo, el sudor brilla bajo las luces blancas frías del techo. El sonido de fricción entre la suela de su zapato y el piso de madera se amplifica, como si tensara un arco para almacenar energía; la cámara montada en el hombro lo sigue mientras se desliza por la zona de tres segundos. Al instante siguiente, se corta a una toma en cámara ultra-lenta bajo la canasta —— parece ser expulsado del suelo. A contraluz, su silueta se eleva, el brazo traza un arco completo. El leve temblor de la cadena metálica del aro se alarga. El ruido alrededor repentinamente entra en vacío. El balón choca pesadamente contra el aro, este tiembla violentamente. La cámara se precipita hacia los asientos del público. Brazos ondeando y palomitas desbordándose explotan en trayectorias de cámara lenta; desde una perspectiva aérea, los efectos LED barren el marcador como fuegos artificiales. El comentarista grita \"¡Y-UNO!\" —— Los vítores en forma de ola se detienen abruptamente al final de los ocho segundos, dejando solo el latido de baja frecuencia que hace vibrar el pecho."])</script><script>self.__next_f.push([1,"5:[\"$\",\"$Ld\",null,{\"i18nConfig\":{\"locale\":\"es-419\",\"translations\":{\"{name} is the action engine that goes beyond answers to execute tasks, automate workflows, and extend your human reach.\":\"{name} es el motor de acción que va más allá de las respuestas para ejecutar tareas, automatizar flujos de trabajo y ampliar su alcance humano.\",\"Successfully\":\"Exitosamente\",\"Export failed\" ollection\":\"Explora más casos de uso de nuestra colección oficial\",\"Explore more\":\"Explorar más\",\"{prd} Updates\":\"Actualizaciones de {prd}\",\"{product} is not available in your region.\":\"{product} no está disponible en tu región.\",\"Back to home\":\"Volver al inicio\",\"Monthly cost\":\"Costo mensual\",\"Monthly credits\":\"Créditos mensuales\",\"Estimated tasks\":\"Tareas estimadas\",\"~{taskCount} tasks\":\"~{taskCount} tareas\",\"Estimate your team's usage\":\"Estime el uso de su equipo\",\"Team size\":\"Tamaño del equipo\",\"seats\":\"asientos\",\"A typical task uses ~ {credits} credits\":\"Una tarea típica utiliza ~ {credits} créditos\",\"Add members to try it out, billing adjusts next cycle\":\"Agrega miembros para probarlo, la facturación se ajustará en el próximo ciclo\",\"Simple, transparent pricing\":\"Precios simples y transparentes\",\"Team Plan\":\"Plan de Equipo\",\"Beta\":\"Beta\",\"Easy to get started\":\"Fácil de comenzar\",\"The AI that makes your entire team expert-level productive, not just the tech-savvy ones.\":\"La IA que hace que todo tu equipo sea productivo a nivel experto, no solo los expertos en tecnología.\",\"Execute complex workflows in minutes\":\"Ejecuta flujos de trabajo complejos en minutos\",\"{product} agents research, analyze, code, deploy, and manage tasks across your entire stack. Better yet, they can run tasks in parallel — delivering results in minutes.\":\"Los agentes de {product} investigan, analizan, codifican, implementan y gestionan tareas en toda tu pila tecnológica. Aún mejor, pueden ejecutar tareas en paralelo, entregando resultados en minutos.\",\"Collaborate with your teammates\":\"Colabora con tu equipo\",\"Work together in shared spaces where everyone can contribute. No more copy-pasting work deliverables.\":\"Trabajen juntos en espacios compartidos donde todos puedan contribuir. No más copiar y pegar entregables.\",\"Connect with tools you already use\":\"Conéctate con las herramientas que ya usas\",\"{product} integrates seamlessly with your existing tools, Google Calendar, Github, Notion, Slack, and \u003cspan\u003emore\u003c/span\u003e.\":\"{product} se integra perfectamente con las herramientas que ya usas, como Google Calendar, Github, Notion, Slack y \u003cspan\u003emás\u003c/span\u003e.\",\"Enterprise-Level security\":\"Seguridad de nivel empresarial\",\"We are SOC 2 and GDPR compliant. We do not train models on your data. \u003clink\u003eLearn more\u003c/link\u003e\":\"Cumplimos con SOC 2 y GDPR. No entrenamos modelos con tus datos. \u003clink\u003eMás información\u003c/link\u003e\",\"Effective user management\":\"Gestión efectiva de usuarios\",\"Unified billing management. Credits are pooled across your team. We provide admin dashboard with usage stats.\":\"Gestión de facturación unificada. Los créditos se comparten en tu equipo. Proporcionamos un panel de administración con estadísticas de uso.\",\"Is my team's data secure with {product}?\":\"¿Están seguros los datos de mi equipo con {product}?\",\"Yes, {product} explicitly prohibits model providers from training on our Team/Enterprise Plan customers' data. Additionally, we provide granulated sharing controls that allow you to precisely manage how deliverables can be shared. We also comply with GDPR and other relevant data protection regulations. Our \u003clink\u003eTrust Center\u003c/link\u003e provides comprehensive information about our security and privacy measures.\":\"Sí, {product} prohíbe explícitamente a los proveedores de modelos entrenar con los datos de nuestros clientes en el plan Equipo/Empresa. Además, proporcionamos controles de compartición detallados que te permiten gestionar con precisión cómo se pueden compartir los entregables. También cumplimos con el GDPR y otras regulaciones relevantes de protección de datos. Nuestro \u003clink\u003eCentro de Confianza\u003c/link\u003e ofrece información completa sobre nuestras medidas de seguridad y privacidad.\",\"What makes {product} different from other AI tools?\":\"¿Qué hace que {product} sea diferente de otras herramientas de IA?\",\"{product} is a genre-defining smart AI agent, not just another chatbot. It actively streamlines busywork and delivers production-ready results. With flexible team pricing and upcoming collaboration features, it transforms how teams work with AI through simple, intuitive onboarding.\":\"{product} es un agente inteligente de IA que define un género, no solo otro chatbot. Simplifica activamente las tareas tediosas y entrega resultados listos para producción. Con precios flexibles para equipos y características de colaboración próximas, transforma cómo los equipos trabajan con IA a través de un inicio simple e intuitivo.\",\"How does the flexible billing work?\":\"¿Cómo funciona la facturación flexible?\",\"You can invite members to your team anytime. Your bill adjusts at the next billing cycle to match your team size. Members can leave anytime if it doesn't work for them, with no additional charges. There's no commitment required until you're satisfied with the value.\":\"Puedes invitar miembros a tu equipo en cualquier momento. Tu factura se ajusta en el siguiente ciclo de facturación según el tamaño de tu equipo. Los miembros pueden salir en cualquier momento si no funciona para ellos, sin cargos adicionales. No se requiere compromiso hasta que estés satisfecho con el valor.\",\"How do pooled credits benefit my team?\":\"¿Cómo benefician los créditos compartidos a mi equipo?\",\"Each billed user adds credits to your team's shared pool. This eliminates waste and maximizes your subscription value. Team members who use AI heavily can tap into unused credits from lighter users before additional costs are incurred.\":\"Cada usuario facturado agrega créditos al fondo compartido de su equipo. Esto elimina desperdicios y maximiza el valor de su suscripción. Los miembros del equipo que usan mucho la IA pueden utilizar los créditos no usados por los usuarios más ligeros antes de incurrir en costos adicionales.\",\"What if my team uses up all credits?\":\"¿Qué pasa si mi equipo agota todos los créditos?\",\"Team owners can purchase add-on credits in Team settings → Billing. You can also set up auto-purchase to prevent interruptions when credits run low. Add-on credits remain valid as long as your subscription stays active.\":\"Los propietarios del equipo pueden adquirir créditos adicionales en Configuración del equipo → Facturación. También puede configurar la compra automática para evitar interrupciones cuando los créditos estén bajos. Los créditos adicionales seguirán siendo válidos mientras su suscripción esté activa.\",\"How do I upgrade from individual to team?\":\"¿Cómo actualizo de individual a equipo?\",\"Yes, you can upgrade to a Team plan in your Account page or join a Team plan created by your teammate.\":\"Sí, puedes actualizar al plan Equipo en la página de tu cuenta o unirte a un plan Equipo creado por un compañero.\",\"Hands on AI for your team\":\"IA práctica para tu equipo\",\"{product} works like an extra teammate — handling the busywork, connecting with your tools, and freeing you to focus on building.\":\"{product} funciona como un compañero adicional — manejando las tareas tediosas, conectando con tus herramientas y permitiéndote concentrarte en crear.\",\"Contact sales\":\"Contacta al equipo de ventas\",\"A secure, collaborative Action Engine\":\"Un motor de acción seguro y colaborativo\",\"Frequently asked questions\":\"Preguntas frecuentes\",\"Your trust is our priority.\":\"Tu confianza es nuestra prioridad.\",\"Visit trust center\":\"Visita el centro de confianza\",\"Ready to empower your team?\":\"¿Listo para potenciar a su equipo?\",\"Australian dog food market\":\"Mercado de comida para perros en Australia\",\"Strategy\":\"Estrategia\",\"Outdoor Ads Options in Japan\":\"Opciones de anuncios exteriores en Japón\",\"Marketing\":\"Marketing\",\"Book travel arrangements for a conference\":\"Reservar arreglos de viaj area o pregunta cualquier cosa\",\"Send(↵)\":\"Enviar(↵)\",\"What are credits?\":\"¿Qué son los créditos?\",\"Credits are our standard unit of measurement for {product} usage - the more complex or lengthy the task, the more credits it requires.\":\"Los créditos son nuestra unidad estándar de medida para el uso de {product}. Mientras más compleja o extensa sea la tarea, más créditos requerirá.\",\"How do credits work?\":\"¿Cómo funcionan los créditos?\",\"Credits are primarily consumed based on:\":\"Los créditos se consumen principalmente en función de:\",\"\u003cbold\u003eLLM tokens\u003c/bold\u003e: Used for task planning, decision making, and output generation.\":\"\u003cbold\u003eTokens LLM\u003c/bold\u003e: Se utilizan para la planificación de tareas, la toma de decisiones y la generación de resultados.\",\"\u003cbold\u003eVirtual machines\u003c/bold\u003e: Used for cloud environments that support file operations, browser automation, and code execution.\":\"\u003cbold\u003eMáquinas virtuales\u003c/bold\u003e: Utilizadas para entornos en la nube que admiten operaciones con archivos, automatización de navegadores y ejecución de código.\",\"\u003cbold\u003eThird-party APIs\u003c/bold\u003e: Used for accessing integrated external services, such as financial data and professional databases.\":\"\u003cbold\u003eAPIs de terceros\u003c/bold\u003e: Usadas para acceder a servicios externos integrados, como datos financieros y bases de datos profesionales.\",\"The specific credits consumption for a task is determined by its complexity and duration. Credits are only consumed during active task processing - completed tasks and the storage or deployment of their outputs do not consume any credits, so there's no need to delete completed tasks.\":\"El consumo específico de créditos de una tarea se determina por su complejidad y duración. Los créditos solo se consumen durante el procesamiento activo de la tarea: las tareas completadas y el almacenamiento o despliegue de sus resultados no consumen créditos, por lo que no es necesario eliminar las tareas completadas.\",\"We provide a full refund of consumed credits for tasks that fail due to technical issues on our end. We will continuously optimize system efficiency and reduce the number of credits consumed per task.\":\"Proporcionamos un reembolso completo de los créditos consumidos en tareas que fallen debido a problemas técnicos de nuestra parte. Continuaremos optimizando la eficiencia del sistema y reduciendo la cantidad de créditos consumidos por tarea.\",\"Usage examples\":\"Ejemplos de uso\",\"Here are some examples demonstrating credits consumption across different task types and complexity levels.\":\"Aquí hay algunos ejemplos que demuestran el consumo de créditos en diferentes tipos de tareas y niveles de complejidad.\",\"How to get more credits?\":\"¿Cómo obtener más créditos?\",\"For Free users, you can upgrade to a membership for more credits:\":\"Para usuarios gratuitos, pueden actualizar a una membresía para obtener más créditos:\",\"\u003cbold\u003e{planName} plan: {credits}\u003c/bold\u003e credits per month\":\"\u003cbold\u003ePlan {planName}: {credits}\u003c/bold\u003e créditos al mes\",\"If you're already a member but need more credits, you can purchase add-on credits, currently available in three tiers:\":\"Si ya eres miembro pero necesitas más créditos, puedes comprar créditos adicionales, actualmente disponibles en tres niveles:\",\"\u003cbold\u003e1,900\u003c/bold\u003e credits package\":\"Paquete de \u003cbold\u003e1,900\u003c/bold\u003e créditos\",\"\u003cbold\u003e9,900\u003c/bold\u003e credits package\":\"Paquete de \u003cbold\u003e9,900\u003c/bold\u003e créditos\",\"\u003cbold\u003e19,900\u003c/bold\u003e credits package\":\"\u003cbold\u003e19,900\u003c/bold\u003e paquete de créditos\",\"To learn more about membership benefits or to upgrade to a paid plan, \u003cupgrade\u003eclick here\u003c/upgrade\u003e.\":\"Para obtener más información sobre los beneficios de la membresía o actualizar a un plan de pago, \u003cupgrade\u003ehaz clic aquí\u003c/upgrade\u003e.\",\"Note: Only premium members may purchase and use add-on credits.\":\"Nota: Solo los miembros premium pueden comprar y usar créditos adicionales.\",\"Will credits expire?\":\"¿Los créditos expiran?\",\"Credits are consumed in the following order: event credits, daily credits, monthly credits, add-on credits, and free credits.\":\"Los créditos se consumen en el siguiente orden: créditos de eventos, créditos diarios, créditos mensuales, créditos adicionales y créditos gratuitos.\",\"Free credits and add-on credits never expire.\":\"Los créditos gratuitos y adicionales nunca vencen.\",\"Event credits can be earned by participating in events and expire when the event ends.\":\"Los créditos de eventos se pueden ganar al participar en eventos y expiran cuando finaliza el evento.\",\"NBA player scoring efficiency quadrant chart\":\"Gráfico de cuadrantes de eficiencia de anotación de jugadores de la NBA\",\"Standard\":\"Estándar\",\"Data analysis\":\"Análisis de datos\",\"Visualization research\":\"Investigación de visualización\",\"15 minutes\":\"15 minutos\",\"Elegant Simple Luxurious Wedding Invitation Webpage\":\"Página web de invitación de boda elegante, simple y lujosa\",\"Website design\":\"Diseño de sitio web\",\"Code development\":\"Desarrollo de código\",\"Website deployment\":\"Despliegue del sitio web\",\"25 minutes\":\"25 minutos\",\"Daily sky events web app with location-based reports\":\"Aplicación web de eventos celestes diarios con informes basados en ubicación\",\"Complex\":\"Complejo\",\"App development\":\"Desarrollo de aplicaciones\",\"Data integration\":\"Integración de datos\",\"Interactive website deployment\":\"Despliegue de sitio web interactivo\",\"80 minutes\":\"80 minutos\",\"Complexity\":\"Complejidad\",\"Task type\":\"Tipo de tarea\",\"Duration\":\"Duración\",\"Credits used\":\"Créditos utilizados\",\"Credits used \u003ccredits\u003e\u003c/credits\u003e\":\"Créditos usados \u003ccredits\u003e\u003c/credits\u003e\",\"Watch replay\":\"Ver repetición\",\"{product}'s Transparency Hub\":\"Centro de Transparencia de {product}\",\"A look at {product}'s key processes, programs, \u003cbr\u003e\u003c/br\u003eand practices for responsible AI innovation.\":\"Una mirada a los procesos clave, programas, \u003cbr\u003e\u003c/br\u003ey prácticas de {product} para la innovación responsable en IA.\",\"Introducing Cloud Browser\":\"Presentación de Cloud Browser\",\"Today, we're launching Cloud Browser — a browser that can sync your login state, access the web, and carry out tasks on your behalf. After your initial manual action, it can take over similar tasks in the future without interruptions caused by login issues. To ensure a safe and thoughtful rollout, Cloud Browser is now available for trial to all users. This research preview will help us learn from users and the broader ecosystem, allowing us to iterate and improve through real-world use.\":\"Hoy estamos lanzando Cloud Browser: un navegador que puede sincronizar tu estado de inicio de sesión, acceder a la web y realizar tareas en tu nombre. Después de tu acción manual inicial, puede encargarse de tareas similares en el futuro sin interrupciones causadas por problemas de inicio de sesión. Para garantizar un despliegue seguro y cuidadoso, Cloud Browser ahora está disponible para que todos los usuarios lo prueben. Esta vista previa de investigación nos ayudará a aprender de los usuarios y del ecosistema en general, permitiéndonos iterar y mejorar a través del uso en el mundo real.\",\"How It Works\":\"Cómo funciona\",\"One-Time Login, Cross-Session Access\":\"Inicio de sesión único, acceso entre sesiones\",\"When you open the browser in a session and manually log in to a website successfully, with your prior consent, we encrypt and save your login information (such as cookies and local storage data). As long as your login session remains valid and you haven't logged out manually, this information will be carried over to other sessions automatically, without needing to log in again. This ensures that when you use {product} to perform automated tasks, the workflow won't be interrupted due to missing login states.\":\"Cuando abre el navegador en una sesión e inicia sesión manualmente en un sitio web con éxito, con su consentimiento previo, ciframos y guardamos su información de inicio de sesión (como cookies y datos de almacenamiento local). Mientras su sesión de inicio sea válida y no cierre la sesión manualmente, esta información se transferirá automáticamente a otras sesiones, sin necesidad de volver a iniciar sesión. Esto asegura que cuando use {product} para realizar tareas automatizadas, el flujo de trabajo no se interrumpa debido a estados de inicio de sesión ausentes.\",\"Please note: At present, we do not offer a unified browser entry point for logging into websites in advance. However, we believe this feature is essential and plan to introduce it in future versions.\":\"Por favor, ten en cuenta: Actualmente, no ofrecemos un punto de entrada unificado en el navegador para iniciar sesión en sitios web con antelación. Sin embargo, creemos que esta función es esencial y planeamos introducirla en versiones futuras.\",\"How is login information saved and loaded?\":\"¿Cómo se guarda y carga la información de inicio de sesión?\",\"We save your login information as a set of encrypted files and securely upload them to our storage servers. This information includes:\":\"Guardamos tu información de inicio de sesión como un conjunto de archivos encriptados y los subimos de forma segura a nuestros servidores de almacenamiento. Esta información incluye:\",\"Cookies\":\"Cookies\",\"Local Storage\":\"Almacenamiento local\",\"When you use Cloud Browser again, this information is securely loaded and written into a new browser sandbox, allowing websites to \\\"remember\\\" you. You can manage your stored login information via the \u003cbold\u003eSettings \u003e Cloud Browser\u003c/bold\u003e interface.\":\"Cuando vuelvas a usar Cloud Browser, esta información se cargará de forma segura y se escribirá en un nuevo entorno de navegador aislado, permitiendo que los sitios web te \\\"recuerden\\\". Puedes gestionar tu información de inicio de sesión almacenada a través de la interfaz de \u003cbold\u003eAjustes \u003e Cloud Browser\u003c/bold\u003e.\",\"We also use conflict detection mechanisms to prevent login state confusion across multiple sessions.\":\"También utilizamos mecanismos de detección de conflictos para evitar confusiones de estado de inicio de sesión entre varias sesiones.\",\"Cross-Device Sync Support\":\"Soporte de sincronización entre dispositivos\",\"Because your login credentials are stored in the cloud, your login state can be synchronized across devices as long as you're signed into {product} with the same account. For example, you can log into a website in a sandbox on your work computer, and then seamlessly continue the task on your laptop or another device—without needing to log in again.\":\"Debido a que tus credenciales de inicio de sesión están almacenadas en la nube, tu estado de inicio de sesión se puede sincronizar entre dispositivos siempre que hayas iniciado sesión en {product} con la misma cuenta. Por ejemplo, puedes iniciar sesión en un sitio web dentro de un entorno aislado en tu computadora del trabajo y luego continuar la tarea sin interrupciones en tu computadora portátil u otro dispositivo, sin necesidad de volver a iniciar sesión.\",\"Explicit Sign-Out Mechanism\":\"Mecanismo explícito de cierre de sesión\",\"You can manually clear login states from all sessions at any time. Simply click “Cookies and website data - Delete all” in your Cloud Browser to immediately remove login data across all devices and sandboxes.\":\"Puede borrar manualmente los estados de inicio de sesión de todas las sesiones en cualquier momento. Simplemente haga clic en “Cookies y datos de sitios web - Eliminar todo” en su navegador en la nube para eliminar de inmediato los datos de inicio de sesión en todos los dispositivos y entornos aislados.\",\"This helps ensure your account remains secure when you no longer need to use {product}.\":\"Esto ayuda a garantizar que su cuenta siga siendo segura cuando ya no necesite usar {product}.\",\"\u003cbold\u003eNote:\u003c/bold\u003e This action affects newly created sessions, but existing ones may still retain login states. To protect your data, please be cautious when sharing sandbox links that may include active login sessions.\":\"\u003cbold\u003eNota:\u003c/bold\u003e Esta acción afecta a las sesiones recién creadas, pero las existentes pueden seguir conservando estados de inicio de sesión. Para proteger tus datos, por favor, ten precaución al compartir enlaces de entornos aislados que puedan incluir sesiones activas de inicio de sesión.\",\"Safety and Privacy\":\"Seguridad y privacidad\",\"Ensuring the safe use of Cloud Browser is an important task, and we implement several safeguards to prevent misuse and ensure users remain firmly in control.\":\"Garantizar el uso seguro de Cloud Browser es una tarea importante, y hemos implementado varias medidas de protección para prevenir el mal uso y asegurar que los usuarios mantengan siempre el control.\",\"First, we take measures to ensure that users are always in control when using Cloud Browser, especially at critical moments.\":\"Primero, tomamos medidas para garantizar que los usuarios siempre estén en control al usar Cloud Browser, especialmente en momentos críticos.\",\"\u003cbold\u003eTakeover Mode\u003c/bold\u003e: Cloud Browser requires users to take control whenever they input sensitive information, such as login credentials or payment details. In Takeover Mode, Cloud Browser does not collect or intercept any user input.\":\"\u003cbold\u003eModo de Toma de Control\u003c/bold\u003e: Cloud Browser requiere que los usuarios tomen el control cada vez que introducen información sensible, como credenciales de inicio de sesión o detalles de pago. En el Modo de Toma de Control, Cloud Browser no recopila ni intercepta ninguna entrada del usuario.\",\"\u003cbold\u003eUser Confirmation\u003c/bold\u003e: Before completing any major action—such as placing an order or sending an email—we return decision-making authority to the user and seek their explicit approval.\":\"\u003cbold\u003eConfirmación del Usuario\u003c/bold\u003e: Antes de completar cualquier acción importante, como realizar un pedido o enviar un correo electrónico, devolvemos la autoridad de decisión al usuario y solicitamos su aprobación explícita.\",\"Next, we have carried out privacy management in Cloud Browser.\":\"A continuación, hemos implementado la gestión de privacidad en Cloud Browser.\",\"\u003cbold\u003eZero Training Commitment\u003c/bold\u003e: We do not use your data to train models. {product} is powered by the world's leading AI models. Currently, our AI model providers include Anthropic, Google, OpenAI, etc.\":\"\u003cbold\u003eCompromiso de entrenamiento cero\u003c/bold\u003e: No utilizamos sus datos para entrenar modelos. {product} está impulsado por los modelos de IA líderes en el mundo. Actualmente, nuestros proveedores de modelos de IA incluyen Anthropic, Google, OpenAI, etc.\",\"\u003cbold\u003eStrict Data Isolation\u003c/bold\u003e: We take your account security very seriously. All login data is locally encrypted before being uploaded, and then encrypted again for storage in the cloud. We never store or transmit your account information on Cloud Browser in plaintext. Each user's data is strictly isolated and inaccessible to others.\":\"\u003cbold\u003eEstricto Aislamiento de Datos\u003c/bold\u003e: Tomamos muy en serio la seguridad de su cuenta. Todos los datos de inicio de sesión se encriptan localmente antes de ser subidos y luego se vuelven a encriptar para almacenamiento en la nube. Nunca almacenamos ni transmitimos su información de cuenta en texto plano en Cloud Browser. Los datos de cada usuario están estrictamente aislados y son inaccesibles para otros.\",\"Content Moderation\":\"Moderación de Contenido\",\"To ensure our products are used appropriately, we employ a range of programs and tools to address content that may violate the law or our terms. We use a combination of automated technologies and human review, monitoring activity on our services in accordance with our Privacy Policy.\":\"Para garantizar que nuestros productos se utilicen adecuadamente, empleamos una variedad de programas y herramientas para abordar contenido que pueda violar la ley o nuestros términos. Utilizamos una combinación de tecnologías automatizadas y revisión humana, monitoreando las actividades en nuestros servicios de acuerdo con nuestra Política de Privacidad.\",\"Our approach includes:\":\"Nuestro enfoque incluye:\",\"\u003cbold\u003eMachine Detection\u003c/bold\u003e: We use classifiers, inference models, hash matching, blocklists, and other automated systems to identify content that may violate our terms or policies.\":\"\u003cbold\u003eDetección Automática\u003c/bold\u003e: Utilizamos clasificadores, modelos de inferencia, coincidencia de hashes, listas de bloqueo y otros sistemas automatizados para identificar contenido que pueda violar nuestros términos o políticas.\",\"\u003cbold\u003eHuman Review\u003c/bold\u003e: Our team may review flagged content to determine the appropriate course of action.\":\"\u003cbold\u003eRevisión Humana\u003c/bold\u003e: Nuestro equipo puede revisar contenido marcado para determinar el curso de acción apropiado.\",\"When we identify content that violates our terms or policies, we may take the following actions:\":\"Cuando identificamos contenido que viola nuestros términos o políticas, podemos tomar las siguientes acciones:\",\"\u003cbold\u003eAccount Restrictions\u003c/bold\u003e: Terminate or limit access to our products.\":\"\u003cbold\u003eRestricciones de Cuenta\u003c/bold\u003e: Terminar o limitar el acceso a nuestros productos.\",\"\u003cbold\u003eWarnings\u003c/bold\u003e: Notify users of potential violations and possible consequences.\":\"\u003cbold\u003eAdvertencias\u003c/bold\u003e: Notificar a los usuarios sobre posibles violaciones y consecuencias.\",\"\u003cbold\u003eContent Sharing Restrictions\u003c/bold\u003e: Prohibit the sharing of specific content.\":\"\u003cbold\u003eRestricciones de Compartir Contenido\u003c/bold\u003e: Prohibir el intercambio de contenido específico.\",\"While Cloud Browser was designed with these safety measures in mind, no system is flawless. We are committed to continuous improvement through real-world feedback and rigorous testing. If you believe we have made a mistake, you can report it or appeal by emailing \u003ca\u003econtact@manus.im\u003c/a\u003e. We may re-evaluate the case and consider any additional information you provide. If the appeal is successful, we will reverse the enforcement action.\":\"Aunque el Navegador en la Nube fue diseñado con estas medidas de seguridad en mente, ningún sistema es perfecto. Estamos comprometidos con la mejora continua mediante comentarios del mundo real y pruebas rigurosas. Si cree que hemos cometido un error, puede informarlo o apelar enviando un correo electrónico a \u003ca\u003econtact@manus.im\u003c/a\u003e. Podemos reevaluar el caso y considerar cualquier información adicional que proporcione. Si la apelación tiene éxito, revertiremos la acción de ejecución.\",\"What's the difference?\":\"¿Cuál es la diferencia?\",\"We offer two specialized modes for all {product} paid subscribers. Choose between our Speed mode for rapid results or our Quality mode for deeper analysis, switching seamlessly based on your needs.\":\"Ofrecemos dos modos especializados para todos los suscriptores pagos de {product}. Elige entre nuestro modo Velocidad para resultados rápidos o nuestro modo Calidad para un análisis más profundo, cambiando sin esfuerzo según tus necesidades.\",\"How fast do they deliver?\":\"¿Qué tan rápido entregan?\",\"Speed mode\":\"Modo Velocidad\",\"Speed mode is designed for smooth workflows, delivering fast and reliable answers, perfect for keeping momentum going.\":\"El modo Velocidad está diseñado para optimizar los flujos de trabajo, brindando respuestas rápidas y confiables, perfecto para mantener el ritmo.\",\"Quality mode\":\"Modo Calidad\",\"Quality mode is designed for complex and nuanced tasks, delivering exceptionally thoughtful responses that handle intricate challenges with precision.\":\"El modo Calidad está diseñado para tareas complejas y detalladas, ofreciendo respuestas profundamente pensadas que abordan desafíos intrincados con precisión.\",\"How deep do they analyze?\":\"¿Qué tan profundo analizan?\",\"Page count\":\"Número de páginas\",\"8-page market overview with essential trends and players\":\"Resumen de mercado de 8 páginas con tendencias esenciales y actores clave.\",\"Data depth\":\"Profundidad de los datos\",\"Key data points and recent funding examples\":\"Puntos de datos clave y ejemplos recientes de financiamiento.\",\"Actionability\":\"Capacidad de acción\",\"Quick market orientation and awareness\":\"Orientación rápida del mercado y conocimiento.\",\"27-page comprehensive analysis with multi-dimensional insights\":\"Análisis comprensivo de 27 páginas con perspectivas multidimensionales.\",\"Rich data, detailed technical benchmarks, 43 references\":\"Datos enriquecidos, indicadores técnicos detallados y 43 referencias.\",\"Specific strategic recommendations for investors/enterprises\":\"Recomendaciones estratégicas específicas para inversionistas/empresas.\",\"How well do they present?\":\"¿Qué tan bien presentan?\",\"8 slides with a well-structured framework\":\"8 diapositivas con una estructura bien organizada.\",\"Content presentation\":\"Presentación del contenido\",\"Strong content, straightforward formatting\":\"Contenido sólido, formato sencillo.\",\"Information display method\":\"Método de presentación de la información\",\"Primarily uses bento modules\":\"Principalmente utiliza módulos bento.\",\"10 slides with enhanced information density\":\"10 diapositivas con mayor densidad de información.\",\"Solid content, detailed logic, clear information hierarchy\":\"Contenido sólido, lógica detallada, jerarquía de información clara.\",\"Combines bento, Gantt Charts, and scatter plots\":\"Combina módulos bento, diagramas de Gantt y diagramas de dispersión.\",\"Upgrade to unlock Quality mode\":\"Actualiza para desbloquear el modo Calidad\",\"How much do they cost?\":\"¿Cuánto cuestan?\",\"The speed mode efficiently handles most everyday tasks, ideal for high-volume work requiring quick turnaround. The quality mode costs about 20% more due to its more thorough multi-step process and detailed analysis. It excels at complex projects demanding deeper insights, precision, or creative problem-solving—worth the premium when superior results matter most.\":\"El modo Velocidad maneja de manera eficiente la mayoría de las tareas diarias, ideal para trabajos de alto volumen que requieren una rápida ejecución. El modo Calidad cuesta aproximadamente un 20% más debido a su proceso más completo y análisis detallado. Sobresale en proyectos complejos que requieren mayor profundidad, precisión o soluciones creativas, y vale la pena el costo adicional cuando los resultados superiores son esenciales.\",\"Sign in\":\"Iniciar sesión\",\"Sign up\":\"Registrarse\",\"Give {product} a task to work on...\":\"Dale una tarea a {product}...\",\"No history records\":\"No hay registros de historial\",\"History\":\"Historial\",\"File restored successfully\":\"Archivo restaurado con éxito\",\"You can restore version when the task is not in progress.\":\"Puedes restaurar la versión cuando la tarea no esté en progreso.\",\"Restore\":\"Restaurar\",\"Preview is not available for this format.\":\"No se puede obtener una vista previa de este formato.\",\"Please download the file to  construir el futuro de los agentes generales de IA, comenzando ahora. Estamos seleccionando nuestra primera cohorte de Fellows en ciudades principales e industrias. Únete a nosotros para dar forma a esta tecnología emergente.\",\"Apply now\":\"Aplica ahora\",\"About the program\":\"Sobre el programa\",\"The {product} fellow is a hands-on, immersive program for AI-native thinkers around the world. Fellows join a global crew to explore the frontier of agent-based tasks - and bring that power to their local and professional communities.\":\"El programa {product} fellow es un programa práctico e inmersivo para pensadores nativos de IA en todo el mundo. Los fellows se unen a un grupo global para explorar la frontera de tareas basadas en agentes y llevar ese poder a sus comunidades locales y profesionales.\",\"Translate complex workflows into agent-first solutions\":\"Traducir flujos de trabajo complejos en soluciones centradas en agentes\",\"Represent {product} in their community through events \":\"Representar a {product} en su comunidad a través de eventos\",\"Identify and support emerging task creators and power users\":\"Identificar y apoyar a los creadores de tareas emergentes y usuarios avanzados\",\"Meet Our Summer 2025 {product} fellows\":\"Conoce a nuestros fellows de {product} en el verano de 2025\",\"*Listed in alphabetical order\":\"*Enumerados en orden alfabético\",\"Show more\":\"Mostrar más\",\"Show less\":\"Mostrar menos\",\"Major cities\":\"Ciudades principales\",\"New York, San Francisco, Paris, London, Tokyo, Seoul, Singapore, Riyadh etc.\":\"Nueva York, San Francisco, París, Londres, Tokio, Seúl, Singapur, Riad, etc.\",\"Industry hubs\":\"Centros industriales\",\"Manus in entrepreneurship, finance, research, content creation etc.\":\"Emprendedores, finanzas, investigación, creación de contenido, etc.\",\"Online communities\":\"Comunidades en línea\",\"Builders, hackers, students, operators etc.\":\"Constructores, hackers, estudiantes, operadores, etc.\",\"The fellowship network is global. And growing.\":\"La red de becarios es global y está creciendo.\",\"Your city not on the map yet? \u003clink\u003eYou could lead the way.\u003c/link\u003e\":\"¿Tu ciudad aún no está en el mapa? \u003clink\u003ePodrías ser el líder.\u003c/link\u003e\",\"{product} fellow program\":\"Programa {product} fellow\",\"From local hosts to global voices - help shape the future of general AI agents.\\n{product} fellows are bold experimenters and cultural stewards of the AI agent era. They host events, guide new users, and ultimately carry the vision of {product} as the go-to general AI agent for humanity.\":\"De anfitriones locales a voces globales: ayuden a dar forma al futuro de los agentes de IA general.\\nLos fellows de {product} son experimentadores audaces y guardianes culturales de la era de los agentes de IA. Organizan eventos, guían a nuevos usuarios, y llevan la visión de {product} como el agente de IA general de referencia para la humanidad.\",\"Remind me when the next batch opens\":\"Recuérdame cuando se abra el próximo lote\",\"The first batch is now closed.\":\"El primer lote ya está cerrado.\",\"Become a {product} fellow\":\"Conviértete en un fellow de {product}\",\"How much time does the program require?\":\"¿Cuánto tiempo requiere el programa?\",\"Expect to host or co-host ~1 event per month. Planning support is provided.\":\"Se espera organizar o co-organizar aproximadamente 1 evento por mes. Se proporciona apoyo para la planificación.\",\"Do I need to be technical or an AI expert?\":\"¿Necesito ser técnico o experto en IA?\",\"Not at all! Love for {product}, passion, curiosity, and follow-through matter more than technical skills.\":\"¡En absoluto! El amor por {product}, la pasión, la curiosidad y la perseverancia importan más que las habilidades técnicas.\",\"What kind of events can I organize?\":\"¿Qué tipo de eventos puedo organizar?\",\"From hands-on co-creation to panels and showcase nights, any event that brings ry NASA astronauts: Alan Shepard, John Glenn, Neil Armstrong, Buzz Aldrin, Michael Collins, Jim Lovell, Alan Bean, Pete Conrad, Eugene Cernan, Sally Ride, Mae Jemison, Peggy Whitson, Guion Bluford, Chris Hadfield, Jerry Ross, Franklin Chang-Diaz, Charles Duke, Thomas Stafford, James Irwin, Edward White. For each astronaut, include a brief life summary, age during lunar mission (if applicable), and one iconic quote or interview excerpt.\":\"Investiga las biografías de los siguientes 20 astronautas legendarios de la NASA: Alan Shepard, John Glenn, Neil Armstrong, Buzz Aldrin, Michael Collins, Jim Lovell, Alan Bean, Pete Conrad, Eugene Cernan, Sally Ride, Mae Jemison, Peggy Whitson, Guion Bluford, Chris Hadfield, Jerry Ross, Franklin Chang-Diaz, Charles Duke, Thomas Stafford, James Irwin, Edward White. Para cada astronauta, incluye un resumen breve de su vida, edad durante su misión lunar (si aplica) y una cita icónica o fragmento de entrevista.\",\"Create 50 New York event posters in diverse energetic visual styles\":\"Crea 50 carteles de eventos en Nueva York con estilos visuales variados y dinámicos\",\"Generate 50 creative poster designs for a pop-up lifestyle event in New York. Event name: \\\"City Sips: A Taste of New York\\\" — a one-day coffee, music, and design experience. Include date (Sept 14, 2025) and location (Williamsburg, Brooklyn) on every poster. Explore a wide range of styles: brutalist, street art, vintage NYC, minimalism, neon, collage, surrealism. Vary layout, fonts, color schemes, and illustration vs photography textures. Posters should feel energetic, urban, and culturally rich — ideal for both print and social media use. Send me the images in a ZIP file.\":\"Genera 50 diseños creativos de carteles para un evento de estilo de vida en Nueva York. Nombre del evento: \\\"City Sips: A Taste of New York\\\" — una experiencia de café, música y diseño de un día. Incluye la fecha (14 de septiembre de 2025) y el lugar (Williamsburg, Brooklyn) en cada cartel. Explora una amplia variedad de estilos: brutalista, arte callejero, Nueva York vintage, minimalismo, neón, collage y surrealismo. Varía la disposición, las tipografías, esquemas de color y las texturas de ilustración frente a fotografía. Los carteles deben transmitir energía, un estilo urbano y riqueza cultural — ideales para impresión y uso en redes sociales. Envíame las imágenes en un archivo ZIP.\",\"Extract 100 prompts and build structured Notion database entries\":\"Extrae 100 prompts y construye entradas estructuradas en una base de datos de Notion\",\"Extract all English-language prompts from the 100 cases listed in this repo: https://github.com/JimmyLv/awesome-nano-banana?tab=readme-ov-file. Go to my Notion and create a structured Notion database with each prompt stored as a separate entry, including the case reference (title/URL) and the extracted prompt text.\":\"Extrae todos los prompts en inglés de los 100 casos listados en este repositorio: https://github.com/JimmyLv/awesome-nano-banana?tab=readme-ov-file. Ve a mi Notion y crea una base de datos estructurada donde cada prompt se almacene como una entrada separada, incluyendo la referencia del caso (título/URL) y el texto del prompt extraído.\",\"Build a fun “Hotdog or Not” parody image app from Silicon Valley.\":\"Crea una divertida aplicación de parodia “Hotdog or Not” de Silicon Valley.\",\"Create a mobile-first web app that lets anyone:\\n\\nUpload a photo or use the live camera to snap one.\\n\\nGet an instant AI verdict: Hot Dog ✅ or Not Hot Dog ❌.\\n\\nShare results to a public Gallery with filters, comments, and upvotes.\\nInspired by the “Jian-Yang hot dog app” from Silicon Valley.\":\"Crea una aplicación web prioritaria para móviles que permita a cualquiera:\\n\\nSubir una foto o usar la cámara en vivo para tomar una.\\n\\nRecibir un veredicto instantáneo de IA: Hot Dog ✅ o Not Hot Dog ❌.\\n\\nCompartir resultados en una galería pública con filtros, comentarios y votos positivos.\\nInspirada en la aplicación de hot dog de “Jian-Yang” de Silicon Valley.\",\"Create a hair styling web app for customers to try out hair colours and stylists to track customer preferences\":\"Crea una aplicación web de diseño de cabello para que los clientes prueben colores y los estilistas registren las preferencias de los clientes.\",\"Build a mobile-friendly ‘Hair Color Preview’ app for salons. Users can (1) take a selfie with the camera or (2) upload a photo. Detect and segment hair automatically, preserve skin tone and lighting, and render realistic dye overlays in real time. Include: a large color library (natural blacks/browns/blondes/reds + vivid fashion shades + pastels + gradients/ombré), intensity slider, shine/texture controls, before/after toggle, side-by-side compare, and quick presets (e.g., ‘Ash Brown’, ‘Rose Gold’, ‘Blue-Black’). Add save/share image, favorites, and a “Recommended for you” section (suggest shades by undertone). Provide stylist mode to mark formulas/notes. Include CTA to book an appointment, pick services, and estimate price/time. Make it fast, privacy-safe (on-device processing if possible), with clear UX and accessible design.\":\"Crea una aplicación móvil amigable de ‘Vista previa de color de cabello’ para salones. Los usuarios pueden (1) tomarse una selfie con la cámara o (2) subir una foto. Detecta y segmenta el cabello automáticamente, preserva el tono de piel y la iluminación, y aplica superposiciones realistas de tintes en tiempo real. Incluye: una biblioteca amplia de colores (negros/morenos/rubios/rojos naturales + tonos de moda vivos + pasteles + gradientes/degradados), control deslizante de intensidad, ajustes de brillo/ textura, comparación antes/después, comparación lado a lado y ajustes rápidos (ej., ‘Castaño ceniza’, ‘Oro rosado’, ‘Azul-oscuro’). Agrega opciones de guardar/compartir imagen, favoritos y una sección de “Recomendado para ti” (sugiere tonos por subtono). Incluye un modo para estilistas para marcar fórmulas/notas. Agrega un CTA para reservar cita, elegir servicios y estimar precio/tiempo. Hazla rápida, segura para la privacidad (procesamiento en dispositivo si es posible), con diseño claro y accesible.\",\"Make a Singlish learning app to boost speaking and vocab.\":\"Crea una aplicación para aprender Singlish y mejorar el vocabulario y la pronunciación.\",\"Build a “Singlish Speaking \u0026 Matching” App\\n\\nGoal\\nCreate a mobile-first web app that helps users learn Singlish pronunciation and meanings. The app has two core flows:\\n\\nSpeak \u0026 Score: user pronounces a given Singlish word/phrase; the app records audio, transcribes, and scores pronunciation accuracy.\\n\\nMatch Cards: user matches Singlish words to meanings (and optionally sample sentences) to test understanding.\":\"Crea una aplicación de “Habla y Asocia en Singlish”\\n\\nObjetivo\\nCrear una aplicación web prioritaria para móviles que ayude a los usuarios a aprender la pronunciación y el significado del Singlish. La aplicación tiene dos flujos principales:\\n\\nHabla y Puntúa: el usuario pronuncia una palabra/frase de Singlish; la aplicación graba audio, transcribe y califica la precisión de la pronunciación.\\n\\nAsocia Tarjetas: el usuario asocia palabras de Singlish con sus significados (y opcionalmente, frases de ejemplo) para probar su comprensión.\",\"Build a feedback bot with a public testimonial wall.\":\"Crea un bot de retroalimentación con un muro público de testimonios.\",\"Build a customer testimonial wall of love for {product}. find all the amazing feedback on X, LinkedIn, Youtube and more.\\n\\nuse the attached code\\n\\nadd a AI chatbot to answer any Zoom related questions, take answers from this help center. https://help.manus.im/en/\":\"Crea un muro de testimonios de amor de clientes para {product}. Encuentra todos los comentarios increíbles en X, LinkedIn, YouTube y más.\\n\\nUsa el código adjunto\\n\\nAgrega un chatbot de IA para responder a cualquier pregunta relacionada con Zoom, tomando respuestas de este centro de ayuda. https://help.manus.im/en/\",\"Create a site for users to upload UNESCO heritage photos.\":\"Crea un sitio para que los usuarios suban fotos de sitios patrimonio de la UNESCO.\",\"Research all the unesco sites in the world. add them to a animated globe. use this code. allow users to login and add their own photos of the heritage sites. add a gallery of the unesco sites and add scraped photos as seed data\\n        {code}\":\"Investiga todos los sitios de la UNESCO en el mundo. Agrégalos a un globo animado. Usa este código. Permite a los usuarios iniciar sesión y agregar sus propias fotos de los sitios patrimoniales. Agrega una galería de los sitios UNESCO y usa fotos recopiladas como datos iniciales\\n        {code}\",\"Make an app that teaches Gen Z slang with examples.\":\"Crea una aplicación que enseñe jerga de la generación Z con ejemplos.\",\"Build a mobile-first web app that teaches Gen-Z slang through pronunciation + meaning quizzes.\":\"Crea una aplicación web prioritaria para móviles que enseñe jerga de la generación Z mediante pruebas de pronunciación y significado.\",\"Build a social sports app to host and join games.\":\"Crea una aplicación social deportiva para organizar y unirse a juegos.\",\"I need to develop an amateur football (soccer) web app that allows users to organize matches on their own while maintaining a beautiful, modern interface. After development, the app should be permanently deployed and publicly accessible. The core features must include creating matches, confirming participation, and searching for available matches. Each match entry should display complete information, including the title, date, time, location, number of participants, match type, and description. The app should include a match creation form that allows users to easily input all necessary details.\\n\\nVisually, the design should be clean, dynamic, and user-friendly, featuring colorful badges, notification icons, and user avatars, and it must be fully responsive for mobile devices. Additionally, the platform should include a user authentication system (login and signup) and a personal profile section where users can fill in and update their personal information. The final version of the app should be fully developed, deployed, and maintained for long-term use.\":\"$e\",\"Create a finance app to upload invoices and view expense charts.\":\"Crea una aplicación financiera para cargar facturas y visualizar gráficos de gastos.\",\"Help me build a personal finance management website. It should include a dedicated debt management section and support automatic import of uploaded invoice files. I need easy expense tracking with clear monthly and weekly financial views. The system must have complete CRUD operations and dashboard reporting capabilities, while being practical, simple, and user-friendly.\":\"Ayúdame a construir un sitio web de gestión de finanzas personales. Debería incluir una sección dedicada al manejo de deudas y soportar la importación automática de archivos de facturas cargadas. Necesito un seguimiento fácil de los gastos con vistas financieras claras mensuales y semanales. El sistema debe tener operaciones CRUD completas y capacidades de informes en el tablero, siendo práctico, sencillo y fácil de usar.\",\"Landing Page\":\"Página de destino\",\"Portfolio\":\"Portafolio\",\"Event\":\"Evento\",\"Get started with\":\"Comienza con\",\"Import from Figma\":\"Importar desde Figma\",\"From prompt to web apps\":\"De entrada a aplicaciones web\",\"Build your first AI-native web apps\":\"Crea tus primeras aplicaciones web nativas de IA\",\"Campaign\":\"Campaña\",\"Build Al web apps with 1 trillion free tokens\":\"Construye aplicaciones web de IA con 1 billón de tokens gratis\",\"Templates\":\"Plantillas\",\"Choose a template\":\"Elegir una plantilla\",\"Pages to generate\":\"Páginas a generar\",\"Edit title\":\"Editar título\",\"Please enter a new title\":\"Por favor, ingrese un nuevo t
